[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regiswitch"
version = "0.1.0"
description = "Switch registered files between named profiles"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "tomli-w>=1.0",
]

[project.scripts]
regiswitch = "regiswitch.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
