[project]
name = "regiswitch"
version = "0.1.0"
description = "Python CLI tool for file switching based on profiles"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
regiswitch = "regiswitch.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
